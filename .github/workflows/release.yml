name: Release

# Two triggers into the same job:
#   1. push of a "v*" tag — the automatic path: `make release-push` pushes the annotated tag
#      `make release` just created, which fires this.
#   2. workflow_dispatch — manual rebuild from the Actions tab. Leave `tag` empty to rebuild the
#      latest existing tag, or give an exact tag to rebuild that one.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (defaults to the latest tag if left empty)'
        required: false

permissions:
  contents: write # gh release create needs this to publish/attach assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — needed to resolve "latest tag" and read CHANGELOG.md at that tag

      - name: Resolve target tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_REF: ${{ github.ref }}
        # Untrusted/dynamic values (the manual dispatch's free-text tag input) are passed in via
        # `env:`, never interpolated into the script — the documented hardening against script
        # injection through ${{ }} expressions.
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(git describe --tags --abbrev=0)"
          else
            TAG="${PUSHED_REF#refs/tags/}"
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "❌ Tag $TAG does not exist."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $TAG"

      - name: Checkout target tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: git checkout "$TAG"

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          VER="${TAG#v}"
          awk "/^## \[$VER\]/{f=1;print;next} /^## \[/{f=0} f" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "❌ No CHANGELOG.md entry found for [$VER] — document the release before publishing."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test -race -count=1 ./...

      - name: Build all platforms
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        # Every target is built with CGO_ENABLED=0: harness-wiki has no cgo dependency (no
        # clipboard, no native library), so the binaries are static and cross-compile from this runner.
        run: |
          LDFLAGS="-s -w -X github.com/gurcuff91/harness-wiki/internal/version.Version=$TAG"
          mkdir -p dist
          build() {
            local goos=$1 goarch=$2 suffix=$3
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -ldflags "$LDFLAGS" -o "dist/harness-wiki-$goos-$goarch$suffix" ./cmd/harness-wiki
          }
          build darwin  amd64 ""
          build darwin  arm64 ""
          build linux   amd64 ""
          build linux   arm64 ""
          build windows amd64 ".exe"

      - name: Package archives
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          cd dist
          # Each raw binary goes into its own dir so the archive's entry is just "harness-wiki"
          # (or "harness-wiki.exe"), not "harness-wiki-linux-arm64".
          package_unix() {
            local os=$1 arch=$2
            mkdir -p "$os-$arch" && mv "harness-wiki-$os-$arch" "$os-$arch/harness-wiki"
            chmod +x "$os-$arch/harness-wiki"
            tar -czf "harness-wiki-${TAG}-${os}-${arch}.tar.gz" -C "$os-$arch" harness-wiki
            rm -rf "$os-$arch"
          }
          package_windows() {
            local os=$1 arch=$2
            mkdir -p "$os-$arch" && mv "harness-wiki-$os-$arch.exe" "$os-$arch/harness-wiki.exe"
            (cd "$os-$arch" && zip -q "../harness-wiki-${TAG}-${os}-${arch}.zip" harness-wiki.exe)
            rm -rf "$os-$arch"
          }
          package_unix darwin amd64
          package_unix darwin arm64
          package_unix linux amd64
          package_unix linux arm64
          package_windows windows amd64
          ls -lh .

      - name: Generate checksums
        run: |
          cd dist
          sha256sum harness-wiki-*.tar.gz harness-wiki-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # `gh release create` has no "replace if exists" flag, so a manual re-run over a tag that
          # already has a Release deletes that Release first. --cleanup-tag is deliberately omitted:
          # this only removes the GitHub Release, never the git tag `make release` created.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — deleting it before re-publishing."
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            dist/harness-wiki-*.tar.gz dist/harness-wiki-*.zip dist/SHA256SUMS.txt \
            --title "$TAG" \
            --notes-file release-notes.md
